<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskEarn BD</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
header{
  background:#0d6efd;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
.hero{
  text-align:center;
  padding:55px 20px;
  background:white;
}
.hero h2{font-size:30px;margin:10px 0}
.hero p{font-size:17px;color:#555}
button{
  border:0;
  padding:13px 22px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  margin:5px;
}
.login{background:#0d6efd;color:white}
.register{background:#198754;color:white}
.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:30px 15px;
}
.card{
  background:white;
  width:220px;
  padding:25px 15px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 3px 12px #ddd;
}
.card h3{color:#0d6efd}
footer{
  text-align:center;
  padding:20px;
  background:#222;
  color:white;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
  padding:20px;
}
.box{
  background:white;
  width:100%;
  max-width:400px;
  padding:25px;
  border-radius:12px;
}
.box h2{text-align:center}
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:7px;
}
.close{
  float:right;
  font-size:24px;
  cursor:pointer;
}
.message{
  text-align:center;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>TaskEarn BD</h1>
  <p>ছোট ছোট টাস্ক সম্পন্ন করে পয়েন্ট অর্জন করুন</p>
</header>
